<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mitlesen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Layout: Ein Bildschirm. Oben Text (füllt alles), unten zwei riesige Tasten. */
  :root {
    --bg: #fbf8f1;
    --fg: #14130f;
    --muted: #5b5649;
    --go: #1f6b3a;
    --stop: #b3261e;
    --line: #d9d2c2;
    --interim: #6f6a5c;
    --font: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
    --size: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12110e; --fg:#fbf7ec; --muted:#bdb6a4; --go:#3fae66; --stop:#ef5a50; --line:#38352d; --interim:#a7a08e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
    -webkit-text-size-adjust: 100%;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-block: 14px; border-bottom: 2px solid var(--line);
  }
  .status { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--muted); flex: none; }
  body.live .dot { background: var(--stop); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { body.live .dot { animation: none; } }
  .tools { display: flex; gap: 8px; }
  .tools button {
    min-width: 56px; height: 56px; font: 700 26px var(--font); color: var(--fg);
    background: transparent; border: 2px solid var(--line); border-radius: 12px; padding: 0 12px;
  }
  main {
    flex: 1; overflow-y: auto; padding-block: 18px; min-height: 0;
    font-size: var(--size); line-height: 1.3; font-weight: 700;
    overflow-wrap: anywhere;
  }
  main p { margin: 0 0 .5em; }
  main .interim { color: var(--interim); }
  .hint { color: var(--muted); font-weight: 400; font-size: 28px; }
  .error { color: var(--stop); font-size: 24px; font-weight: 700; }
  footer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-block: 12px 16px; border-top: 2px solid var(--line); }
  footer button {
    height: 110px; border: 0; border-radius: 20px; color: #fff;
    font: 700 32px var(--font); display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #start { background: var(--go); }
  #stop { background: var(--stop); }
  footer button:disabled { opacity: .3; }
  button:focus-visible { outline: 4px solid var(--fg); outline-offset: 3px; }
  .icon-rec { width: 30px; height: 30px; border-radius: 50%; background: #fff; }
  .icon-stop { width: 28px; height: 28px; border-radius: 4px; background: #fff; }
</style>
</head>
<body>
  <header>
    <div class="status"><span class="dot"></span><span id="statusText">Bereit</span></div>
    <div class="tools">
      <button id="smaller" aria-label="Schrift kleiner">A−</button>
      <button id="bigger" aria-label="Schrift größer">A+</button>
      <button id="clear" aria-label="Text löschen">✕</button>
    </div>
  </header>

  <main id="out" aria-live="polite">
    <p class="hint">Grünen Knopf drücken und sprechen.<br>Der Text erscheint hier.</p>
  </main>

  <footer>
    <button id="start"><span class="icon-rec"></span>Start</button>
    <button id="stop" disabled><span class="icon-stop"></span>Stopp</button>
  </footer>

<script>
(() => {
  const out = document.getElementById('out');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const statusText = document.getElementById('statusText');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // Schriftgröße merken
  let size = 44;
  try { size = parseInt(localStorage.getItem('mitlesen-size')) || 44; } catch (e) {}
  const applySize = () => {
    document.documentElement.style.setProperty('--size', size + 'px');
    try { localStorage.setItem('mitlesen-size', size); } catch (e) {}
  };
  applySize();
  document.getElementById('bigger').onclick = () => { size = Math.min(96, size + 6); applySize(); };
  document.getElementById('smaller').onclick = () => { size = Math.max(24, size - 6); applySize(); };

  let finals = [];      // fertige Sätze
  let interim = '';     // was gerade gesprochen wird
  let wanted = false;   // soll aufgenommen werden?
  let rec = null;
  let wakeLock = null;

  function render() {
    if (!finals.length && !interim) {
      out.innerHTML = wanted
        ? '<p class="hint">Ich höre zu …</p>'
        : '<p class="hint">Grünen Knopf drücken und sprechen.<br>Der Text erscheint hier.</p>';
      return;
    }
    out.innerHTML = '';
    // nur die letzten 30 Absätze anzeigen, damit es übersichtlich bleibt
    finals.slice(-30).forEach(t => { const p = document.createElement('p'); p.textContent = t; out.appendChild(p); });
    if (interim) { const p = document.createElement('p'); p.className = 'interim'; p.textContent = interim; out.appendChild(p); }
    out.scrollTop = out.scrollHeight;
  }

  function showError(msg) {
    out.innerHTML = '';
    const p = document.createElement('p'); p.className = 'error'; p.textContent = msg; out.appendChild(p);
  }

  function setLive(on) {
    document.body.classList.toggle('live', on);
    statusText.textContent = on ? 'Hört zu' : 'Bereit';
    startBtn.disabled = on;
    stopBtn.disabled = !on;
  }

  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) {}
  }

  function makeRec() {
    const r = new SR();
    r.lang = 'de-DE';
    r.continuous = true;
    r.interimResults = true;
    r.onresult = (e) => {
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript.trim();
        if (!t) continue;
        if (e.results[i].isFinal) finals.push(t.charAt(0).toUpperCase() + t.slice(1));
        else interim += (interim ? ' ' : '') + t;
      }
      render();
    };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        wanted = false; setLive(false); keepAwake(false);
        showError('Das Mikrofon ist nicht erlaubt. Bitte in den Browser-Einstellungen das Mikrofon für diese Seite freigeben.');
      } else if (e.error === 'network') {
        wanted = false; setLive(false); keepAwake(false);
        showError('Keine Internetverbindung. Die Spracherkennung braucht Internet.');
      }
      // "no-speech" und "aborted" ignorieren: es wird einfach neu gestartet
    };
    r.onend = () => {
      // Browser beenden nach Stille von selbst – dann neu starten
      if (interim) { finals.push(interim); interim = ''; render(); }
      if (wanted) { try { r.start(); } catch (e) { setTimeout(() => wanted && r.start(), 300); } }
      else { setLive(false); render(); }
    };
    return r;
  }

  startBtn.onclick = () => {
    if (!SR) {
      showError('Dieser Browser kann leider keine Sprache erkennen. Bitte die Seite in Google Chrome (Android) oder Safari (iPhone) öffnen.');
      return;
    }
    if (!rec) rec = makeRec();
    wanted = true;
    try { rec.start(); } catch (e) {}
    setLive(true); keepAwake(true); render();
  };

  stopBtn.onclick = () => {
    wanted = false;
    if (rec) try { rec.stop(); } catch (e) {}
    setLive(false); keepAwake(false);
  };

  document.getElementById('clear').onclick = () => { finals = []; interim = ''; render(); };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wanted) keepAwake(true);
  });
})();
</script>
</body>
</html>
